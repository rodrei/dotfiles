onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
# Sidebar on prefix+e; edit_scrollback takes over prefix+b, freed by the swap.
toggle_sidebar = "prefix+e"
edit_scrollback = "prefix+b"

# Tabs: bracket pairs to move, t to create. copy_mode takes prefix+c,
# freed by new_tab moving to prefix+t.
new_tab = "prefix+t"
previous_tab = "prefix+["
next_tab = "prefix+]"
copy_mode = "prefix+c"

# Navigate mode: j/k move between workspaces (taking over from the arrows).
# Vertical pane movement moves to the arrows, matching left/right which
# already focus panes; h/l still focus panes horizontally.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"
